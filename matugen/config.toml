# Own matugen templates. DMS runs them with its own, in the same matugen run (no
# set order), on every wallpaper change (Settings → Theme → Dynamic,
# runUserMatugenTemplates in dms/settings.json).

[config]

# Spotify: spicetify's "dms-colors" theme; refresh puts the colors into Spotify, its
# dms-live extension repaints an open window.
[templates.spicetify]
input_path = '~/.config/matugen/templates/spicetify-color.ini'
output_path = '~/.config/spicetify/Themes/dms-colors/color.ini'
post_hook = 'spicetify refresh -s >/dev/null 2>&1'

# VS Code: DMS's own theme files (the DankLinux.dms-theme extension) with softer
# contrast — backgrounds a step up from near-black, dimmer text, readable
# comments. The hook waits for DMS to write them in this same run, so it runs
# detached.
[templates.vscode-soften]
input_path = '~/.config/matugen/templates/vscode-soften.json'
output_path = '~/.cache/matugen/vscode-soften.json'
post_hook = 'setsid -f bash ~/Dotfiles/scripts/wrappers/vscode-soften.sh ~/.cache/matugen/vscode-soften.json >/dev/null 2>&1'

# Telegram, iMe, AyuGram: one theme for all of them, the colors plus a chat
# background (the hook packs both into the .tdesktop-theme). Apply it once in each
# (Settings → Chat Settings → Choose from file); they watch the file and repaint
# on every change.
[templates.telegram]
input_path = '~/.config/matugen/templates/telegram-colors.tdesktop-theme'
output_path = '~/.cache/matugen/telegram-colors.tdesktop-theme'
post_hook = 'bash ~/Dotfiles/scripts/wrappers/telegram-theme.sh ~/.cache/matugen/telegram-colors.tdesktop-theme ~/.local/share/matugen/dms.tdesktop-theme'

# Obsidian: a CSS snippet for the AnuPpuccin theme, copied into every vault.
# Turned on once per vault by the installer (Obsidian step) or by hand
# (Settings → Appearance → CSS snippets); Obsidian reloads it on every change.
[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian-colors.css'
output_path = '~/.cache/matugen/obsidian-colors.css'
post_hook = 'bash ~/Dotfiles/scripts/wrappers/obsidian-snippet.sh ~/.cache/matugen/obsidian-colors.css'

# fish and fzf: syntax colors (fish/conf.d/dms-colors.fish sources them at the
# next prompt of every open shell) and fzf's default --color (FZF_DEFAULT_OPTS_FILE).
[templates.fish]
input_path = '~/.config/matugen/templates/fish-colors.fish'
output_path = '~/.cache/matugen/fish-colors.fish'

[templates.fzf]
input_path = '~/.config/matugen/templates/fzf-colors'
output_path = '~/.cache/matugen/fzf-colors'

# clipse (Mod+V): its custom theme, read on every start. JSON has no comments,
# so the template is plain; clipse/config.json points at this file (themeFile).
[templates.clipse]
input_path = '~/.config/matugen/templates/clipse-theme.json'
output_path = '~/.config/clipse/custom_theme.json'

# Zed: "DankShell Soft", built from DMS's own Zed theme with softer surfaces and
# the syntax in the wallpaper's colors. The hook waits for DMS's theme from this
# same run, so it runs detached.
[templates.zed-soften]
input_path = '~/.config/matugen/templates/zed-soften.json'
output_path = '~/.cache/matugen/zed-soften.json'
post_hook = 'setsid -f bash ~/Dotfiles/scripts/wrappers/zed-soften.sh ~/.cache/matugen/zed-soften.json >/dev/null 2>&1'

# Google Chrome: the wallpaper's seed color; scripts/wrappers/chrome-theme.sh puts
# it into Chrome's settings at every Chrome start, Chrome builds its theme from it.
[templates.chrome]
input_path = '~/.config/matugen/templates/chrome-color'
output_path = '~/.cache/matugen/chrome-color'
