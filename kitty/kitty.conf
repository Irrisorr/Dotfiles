# ====================== HOTKEYS ==================
kitty_mod ctrl+shift

map kitty_mod+c     copy_to_clipboard
map kitty_mod+с     copy_to_clipboard
map cmd+c           copy_to_clipboard

map kitty_mod+v     paste_from_clipboard
map kitty_mod+м     paste_from_clipboard
map ctrl+v          paste_from_clipboard
map ctrl+м          paste_from_clipboard
map cmd+v           paste_from_clipboard



# ====================== SHADERS ==================
background_opacity 0.60
cursor_trail 1
background_blur 1
custom_shaders cursor-trail-blaze



# ====================== FONTS ==================
font_size 14.0
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto



# ====================== COLORS ==================
foreground #c0caf5
background #1a1b26

selection_foreground #ffffff
selection_background #14b8a6

color0 #0b0c15      # Black
color1 #d2556c      # Red
color2 #7cd47b      # Green
color3 #efb184      # Yellow
color4 #6ca1f3      # Blue
color5 #b78df0      # Magenta
color6 #69bcf4      # Cyan
color7 #c0caf5      # White
color8  #39404a     # Bright Black
color9  #f7768e     # Bright Red
color10 #85e89d     # Bright Green
color11 #f4cf8d     # Bright Yellow
color12 #8fb9ff     # Bright Blue
color13 #d9a3ff     # Bright Magenta
color14 #8fd3ff     # Bright Cyan
color15 #f0f3f6     # Bright White