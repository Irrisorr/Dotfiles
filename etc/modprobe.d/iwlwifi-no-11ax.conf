# Home TP-Link AP (WPA/WPA2 mixed, group TKIP) silently drops association
# requests that carry 802.11ax (HE) capabilities: auth succeeds, association
# times out, NetworkManager keeps asking for the password. Seen with the
# Intel Wi-Fi 6E AX211; Wi-Fi 5 cards (AC 9560) don't send HE and connect fine.
# Turns 11ax off on every network, so 11ax APs fall back to 11ac speeds.
# Drop this file once the router runs WPA2-PSK with AES only.
options iwlwifi disable_11ax=1
